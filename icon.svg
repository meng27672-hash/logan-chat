<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Chat bubble -->
  <rect x="100" y="150" width="312" height="200" rx="40" fill="#262626" stroke="#444" stroke-width="4"/>
  <circle cx="180" cy="250" r="40" fill="#555"/>
  <text x="180" y="262" text-anchor="middle" font-size="36" fill="#fff" font-family="Arial">J</text>
  <!-- Typing dots -->
  <circle cx="250" cy="240" r="10" fill="#666"/>
  <circle cx="290" cy="240" r="10" fill="#666"/>
  <circle cx="330" cy="240" r="10" fill="#666"/>
  <!-- Bubble tail -->
  <polygon points="100,320 60,380 140,340" fill="#262626" stroke="#444" stroke-width="3"/>
</svg>
