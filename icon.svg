<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#g)"/>
  <!-- Minimal chat bubble - Instagram DM style -->
  <g transform="translate(256,246)">
    <!-- Bubble body -->
    <path d="M-110,-110 L110,-110 Q140,-110 140,-80 L140,60 Q140,90 110,90 L20,90 L-30,145 L-10,90 L-110,90 Q-140,90 -140,60 L-140,-80 Q-140,-110 -110,-110Z" fill="none" stroke="white" stroke-width="14" stroke-linejoin="round"/>
    <!-- Three dots (typing indicator) -->
    <circle cx="-50" cy="-15" r="16" fill="white"/>
    <circle cx="0" cy="-15" r="16" fill="white" opacity="0.6"/>
    <circle cx="50" cy="-15" r="16" fill="white" opacity="0.2"/>
